###      GENERAL    ###
#######################
#######################

# Import extra configurations
general.import = []

general.working_directory = "d:/code/"
general.live_config_reload = true


# Environment
[env]
#Environment variables

[terminal.shell]
program = "C:/Users/coronahg/AppData/Local/Microsoft/WindowsApps/Microsoft.PowerShell_8wekyb3d8bbwe/pwsh.exe"
args = []

[window]
dimensions = { columns = 80, lines = 39 }
position = {x = 690, y = 10 }
padding = { x = 10, y = 10 }
decorations = "Full"
blur = true
startup_mode = "Windowed"

# Font
[font]
size = 18
normal = { family = "MesloLGS Nerd Font", style = "Regular" }

[keyboard]
bindings = [
  { key = "Space", mods = "Control|Shift", action = "SpawnNewInstance" }
]

# Catpuccini Mocha Color scheme
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
